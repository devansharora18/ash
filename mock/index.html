<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ash signaling mock client</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1a1a1a; color: #e0e0e0;
      max-width: 760px; margin: 2rem auto; padding: 0 1rem;
    }
    h1 { font-size: 1.2rem; color: #00d9ff; }
    button, input {
      font: inherit; background: #2d2d2d; color: #e0e0e0;
      border: 1px solid #00d9ff; border-radius: 4px; padding: .4rem .6rem;
    }
    button { cursor: pointer; }
    button:hover { background: #3a3a3a; }
    input { margin-right: .5rem; }
    .row { margin: .6rem 0; }
    #log {
      background: #111; border: 1px solid #333; border-radius: 6px;
      padding: .6rem; height: 320px; overflow-y: auto; white-space: pre-wrap;
      font-size: .85rem; line-height: 1.4;
    }
    .log-line { margin: .1rem 0; }
    .in  { color: #7ee787; }
    .out { color: #00d9ff; }
    .sys { color: #ffd93d; }
    .err { color: #ff6b6b; }
    .muted { color: #888; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>ash — signaling mock</h1>

  <div class="row">
    <label>Server <input id="server" value="http://localhost:8000" size="24" /></label>
  </div>
  <div class="row">
    <label>Peer ID <input id="peerId" size="18" /></label>
  </div>

  <div class="row">
    <button id="createBtn">Create room</button>
    <span class="muted">or</span>
    <input id="roomId" placeholder="room id to join" size="18" />
    <button id="joinBtn">Join room</button>
    <button id="leaveBtn" disabled>Leave</button>
  </div>

  <div class="row">
    <input id="target" placeholder="target peer id" size="18" />
    <button id="signalBtn" disabled>Send test signal</button>
  </div>

  <div class="row muted" id="status">disconnected</div>
  <div id="log"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    const serverInput = $("server");
    const peerInput = $("peerId");
    const roomInput = $("roomId");
    const targetInput = $("target");
    const statusEl = $("status");
    const logEl = $("log");

    let ws = null;
    let myPeerId = "";
    let peers = [];

    if (!peerInput.value) {
      peerInput.value = "peer-" + Math.random().toString(36).slice(2, 8);
    }

    function log(text, cls) {
      const line = document.createElement("div");
      line.className = "log-line " + (cls || "");
      line.textContent = new Date().toLocaleTimeString() + "  " + text;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(text) { statusEl.textContent = text; }

    function serverBase() { return serverInput.value.replace(/\/$/, ""); }
    function wsUrl(roomId) {
      return serverBase().replace(/^http/, "ws") + "/ws/" + roomId + "?peer_id=" + encodeURIComponent(myPeerId);
    }

    function connect(roomId) {
      myPeerId = peerInput.value.trim();
      peers = [];
      ws = new WebSocket(wsUrl(roomId));
      log("connecting to ws://…/ws/" + roomId + " as " + myPeerId, "sys");

      ws.onopen = () => {
        setStatus("connected · room " + roomId);
        $("leaveBtn").disabled = false;
        $("signalBtn").disabled = false;
      };

      ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch {
          log("(non-json) " + e.data, "err"); return;
        }
        switch (msg.type) {
          case "welcome":
            peers = msg.peers || [];
            log("welcome · existing peers: [" + peers.join(", ") + "]", "in");
            break;
          case "peer-joined":
            peers.push(msg.peer_id);
            log("peer-joined: " + msg.peer_id, "in");
            break;
          case "peer-left":
            peers = peers.filter((p) => p !== msg.peer_id);
            log("peer-left: " + msg.peer_id, "in");
            break;
          case "signal":
            log("signal from " + msg.from + ": " + JSON.stringify(msg.data), "in");
            break;
          case "error":
            log("error: " + msg.message, "err");
            break;
          default:
            log("unknown: " + JSON.stringify(msg), "sys");
        }
      };

      ws.onclose = () => {
        setStatus("disconnected");
        $("leaveBtn").disabled = true;
        $("signalBtn").disabled = true;
        log("closed", "sys");
      };

      ws.onerror = () => log("websocket error", "err");
    }

    $("createBtn").onclick = async () => {
      try {
        const res = await fetch(serverBase() + "/rooms", { method: "POST" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        log("created room " + data.room_id, "sys");
        roomInput.value = data.room_id;
        connect(data.room_id);
      } catch (err) {
        log("create failed: " + err.message, "err");
      }
    };

    $("joinBtn").onclick = () => {
      const roomId = roomInput.value.trim();
      if (!roomId) { log("enter a room id first", "err"); return; }
      connect(roomId);
    };

    $("signalBtn").onclick = () => {
      const target = targetInput.value.trim();
      if (!ws || ws.readyState !== WebSocket.OPEN) { log("not connected", "err"); return; }
      if (!target) { log("enter a target peer id", "err"); return; }
      ws.send(JSON.stringify({
        type: "signal",
        to: target,
        data: { kind: "test", nonce: Math.random().toString(36).slice(2) },
      }));
      log("signal -> " + target, "out");
    };

    $("leaveBtn").onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "leave" }));
        log("leave -> server", "out");
      }
      ws.close();
    };
  </script>
</body>
</html>
