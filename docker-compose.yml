services:
  signaling:
    build: ./server
    environment:
      ASH_HOST: 0.0.0.0
      ASH_PORT: 8000
      ASH_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:4173"]'
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Optional public exposure. Requires a valid tunnel token in .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - signaling
    restart: unless-stopped

  # Optional TURN/media relay for WebRTC across NATs (peers on different
  # networks). Needs 3478/tcp+udp open on the host, i.e. on a public IP — not
  # behind the Cloudflare tunnel. Set TURN_REALM/TURN_USER/TURN_PASSWORD in .env.
  turn:
    image: coturn/coturn:latest
    command:
      - -n
      - --realm=${TURN_REALM:-localhost}
      - --user=${TURN_USER:-ash}:${TURN_PASSWORD:-ash}
      - --listening-port=3478
      - --min-port=49152
      - --max-port=65535
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    restart: unless-stopped
