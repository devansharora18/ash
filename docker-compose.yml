services:
  signaling:
    build: ./server
    environment:
      ASH_HOST: 0.0.0.0
      ASH_PORT: 8000
      ASH_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:4173","https://hello.devansharora.in","https://ash-hello.vercel.app","https://ash.vercel.app"]'
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Optional public exposure. Requires a valid tunnel token in .env.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - signaling
    restart: unless-stopped

  # Optional TURN/media relay for WebRTC across NATs (peers on different
  # networks). Needs 3478/tcp+udp open on the host, i.e. on a public IP — not
  # behind the Cloudflare tunnel. Configure TURN_REALM/TURN_USER/TURN_PASSWORD,
  # and TURN_EXTERNAL_IP (its public IP) if the host is behind NAT. Enable TLS
  # (turns://) by mounting certs and setting TURN_TLS_CERT/TURN_TLS_KEY.
  turn:
    image: coturn/coturn:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ARGS="-n --lt-cred-mech --fingerprint --no-cli --log-file=stdout --realm=$$TURN_REALM --user=$$TURN_USER:$$TURN_PASSWORD --listening-port=3478 --min-port=49152 --max-port=65535"
        if [ -n "$$TURN_EXTERNAL_IP" ]; then ARGS="$$ARGS --external-ip=$$TURN_EXTERNAL_IP"; fi
        if [ -n "$$TURN_TLS_CERT" ] && [ -n "$$TURN_TLS_KEY" ]; then ARGS="$$ARGS --cert=$$TURN_TLS_CERT --pkey=$$TURN_TLS_KEY --tls-listening-port=5349"; fi
        exec turnserver $$ARGS
    environment:
      TURN_REALM: ${TURN_REALM:-localhost}
      TURN_USER: ${TURN_USER:-ash}
      TURN_PASSWORD: ${TURN_PASSWORD:-change-me}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_TLS_CERT: ${TURN_TLS_CERT:-}
      TURN_TLS_KEY: ${TURN_TLS_KEY:-}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
    restart: unless-stopped
